[package]
name = "poketools-app"
version = "1.0.0"
description = "宝可梦工具助手——五作图鉴/努力值/特化功能/伤害计算器（完全离线 APK 壳）"
edition = "2021"

[lib]
name = "poketools_app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
